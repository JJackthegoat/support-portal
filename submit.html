
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit a Support Ticket</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }
    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }
    textarea { min-height: 140px; resize: vertical; }
    button {
      margin-top: 22px;
      padding: 14px;
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .success { background: #e8f7ed; color: #166534; }
    .error { background: #feecec; color: #991b1b; }
  </style>
</head>
<body>

<div class="container">
  <h1>Submit a Support Ticket</h1>
  <p>Fill out the form below and our support team will review your request.</p>

  <form id="ticketForm">
    <label for="name">Full Name</label>
    <input id="name" required maxlength="100">

    <label for="email">Email Address</label>
    <input id="email" type="email" required maxlength="254">

    <label for="subject">Subject</label>
    <input id="subject" required minlength="3" maxlength="200">

    <label for="category">Category</label>
    <select id="category" required>
      <option value="">Select a category</option>
      <option>Account</option>
      <option>Billing</option>
      <option>Technical Support</option>
      <option>Bug Report</option>
      <option>Other</option>
    </select>

    <label for="priority">Priority</label>
    <select id="priority">
      <option>Normal</option>
      <option>Low</option>
      <option>High</option>
    </select>

    <label for="description">Description</label>
    <textarea id="description" required minlength="10" maxlength="5000"
      placeholder="Describe your issue..."></textarea>

    <button id="submitBtn" type="submit">Submit Ticket</button>
  </form>

  <div id="result"></div>
</div>

<script>
  // Replace these two values with your Supabase project values.
  const SUPABASE_URL = "sb_publishable_si1STA38mmoMpzHSPhtFcg_z_6529TL";
  const SUPABASE_KEY = "https://lmimebjdafqllzoudzbq.supabase.co/rest/v1/";

  const form = document.getElementById("ticketForm");
  const submitBtn = document.getElementById("submitBtn");
  const result = document.getElementById("result");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (SUPABASE_URL.includes("YOUR_") || SUPABASE_KEY.includes("YOUR_")) {
      showResult("Please configure the Supabase project settings first.", false);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    result.style.display = "none";

    try {
      const response = await fetch(
        SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/submit-ticket",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          },
          body: JSON.stringify({
            p_subject: document.getElementById("subject").value,
            p_customer_name: document.getElementById("name").value,
            p_customer_email: document.getElementById("email").value,
            p_category: document.getElementById("category").value,
            p_priority: document.getElementById("priority").value,
            p_description: document.getElementById("description").value
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || data.details || "Submission failed.");
      }

      showResult(
        "Your ticket has been submitted successfully! Ticket ID: " + data,
        true
      );

      form.reset();

    } catch (error) {
      showResult(
        "We couldn't submit your ticket. " + error.message,
        false
      );
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Ticket";
    }
  });

  function showResult(message, success) {
    result.textContent = message;
    result.className = success ? "success" : "error";
    result.style.display = "block";
  }
</script>

</body>
</html>
